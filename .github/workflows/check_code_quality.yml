name: Check Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install npm
        run: npm install -g npm@12

      - name: Allow git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install packages
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --allow-git=all --prefer-offline --no-audit --no-fund

      - name: Approve install scripts
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          npm install-scripts approve --all
          npm install-scripts deny @scarf/scarf
          npm rebuild

      - name: Check linting
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_PROVIDER: postgresql

      - name: Check build
        run: npm run build
        env:
          DATABASE_PROVIDER: postgresql
