name: Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-latest
            platform: mac-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install npm
        run: npm install -g npm@12

      - name: Allow git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install packages
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --allow-git=all --prefer-offline --no-audit --no-fund

      - name: Approve install scripts
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          npm install-scripts approve --all
          npm install-scripts deny @scarf/scarf
          npm rebuild

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_PROVIDER: postgresql

      - name: Build
        run: npm run build
        env:
          DATABASE_PROVIDER: postgresql

      - name: Create portable package
        run: node desktop/build-portable.js
        env:
          STAGE_DIR: ${{ github.workspace }}/stage

      - name: Prune package dependencies
        run: npm prune --omit=dev --prefix stage --legacy-peer-deps --allow-git=all

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Verify portable stage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'stage'
          if (-not (Test-Path $stage)) { throw "Stage directory not found: $stage" }
          Get-ChildItem -Force $stage | Select-Object -First 15 Name, Length
          "Total files: $((Get-ChildItem -Recurse -File $stage | Measure-Object).Count)"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:GITHUB_WORKSPACE 'stage'
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version /DSRCDIR=$stage installer.nsi

      - name: Archive package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "evolution-api-${{ matrix.platform }}.tar.gz" -C stage .

      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "evolution-api-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: evolution-api-${{ matrix.platform }}
          path: evolution-api-${{ matrix.platform }}.*
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: evolution-api-win-x64-installer
          path: EvolutionAPI-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: 'Evolution API Desktop ${{ github.ref_name }}'
          files: artifacts/*
          overwrite_files: true
          body: |
            ## Evolution API Desktop ${{ github.ref_name }}

            ### Downloads
            - Windows (instalador): `EvolutionAPI-Setup-*.exe`
            - Windows (portátil): `evolution-api-win-x64.zip`
            - Linux x64: `evolution-api-linux-x64.tar.gz`
            - macOS Intel: `evolution-api-mac-x64.tar.gz`
            - macOS Apple Silicon: `evolution-api-mac-arm64.tar.gz`

            O instalador inicia o app sem console e abre o manager automaticamente. Os dados ficam em `%APPDATA%\evolution-api` e são preservados por padrão.

            > O instalador não é assinado digitalmente; o Windows SmartScreen pode exibir um aviso. Clique em "Mais informações" > "Executar assim mesmo".
